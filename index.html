<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="待辦清單">
        <header class="card-header">
          <h1>待辦清單</h1>
          <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">
            <span aria-hidden="true">🌙</span>
            <span>深色模式</span>
          </button>
        </header>

        <div class="input-row">
          <input
            id="todoInput"
            type="text"
            placeholder="新增待辦事項"
            aria-label="待辦事項輸入框"
          />
          <button id="addBtn" type="button">新增</button>
        </div>

        <nav class="filter-row" aria-label="待辦事項篩選">
          <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">未完成</button>
          <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </nav>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <p id="emptyState" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

        <footer class="todo-footer">
          <span id="todoCount">未完成: 0 項</span>
          <button
            id="clearCompletedBtn"
            class="clear-completed-btn"
            type="button"
            aria-label="清除所有已完成的待辦事項"
            disabled
          >
            清除已完成
          </button>
        </footer>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
